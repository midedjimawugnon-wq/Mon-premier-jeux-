<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attrape le cercle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #292929);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 25px;
      font-size: 30px;
    }

    .infos {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      margin: 15px;
      font-size: 20px;
    }

    .box {
      background: #333;
      padding: 10px 18px;
      border-radius: 10px;
    }

    #game {
      position: relative;
      width: 92%;
      max-width: 500px;
      height: 500px;
      margin: 20px auto;
      background: #181818;
      border: 3px solid white;
      border-radius: 15px;
      overflow: hidden;
    }

    #target {
      position: absolute;
      width: 65px;
      height: 65px;
      background: red;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 0 20px red;
    }

    button {
      border: none;
      background: #00c853;
      color: white;
      font-size: 20px;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #00a844;
    }

    #message {
      font-size: 22px;
      margin: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎮 Attrape le cercle</h1>

  <div class="infos">
    <div class="box">🏆 Score : <span id="score">0</span></div>
    <div class="box">⏱️ Temps : <span id="time">30</span>s</div>
    <div class="box">🥇 Record : <span id="best">0</span></div>
  </div>

  <div id="game">
    <div id="target"></div>
  </div>

  <div id="message">Clique sur le cercle rouge !</div>

  <button onclick="restartGame()">🔄 Rejouer</button>

  <script>
    let score = 0;
    let time = 30;
    let gameStarted = false;
    let timer;

    let size = 65;

    const target = document.getElementById("target");
    const game = document.getElementById("game");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const bestText = document.getElementById("best");
    const message = document.getElementById("message");

    let bestScore = localStorage.getItem("bestScore") || 0;
    bestText.textContent = bestScore;

    function moveTarget() {
      const maxX = game.clientWidth - target.clientWidth;
      const maxY = game.clientHeight - target.clientHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function startGame() {
      if (gameStarted) return;

      gameStarted = true;
      message.textContent = "🔥 Continue !";

      timer = setInterval(function() {
        time--;
        timeText.textContent = time;

        if (time <= 0) {
          endGame();
        }
      }, 1000);
    }

    target.addEventListener("click", function() {

      startGame();

      score++;
      scoreText.textContent = score;

      if (size > 35) {
        size -= 2;
        target.style.width = size + "px";
        target.style.height = size + "px";
      }

      moveTarget();
    });

    function endGame() {
      clearInterval(timer);
      gameStarted = false;

      target.style.display = "none";

      message.textContent =
        "🎉 Partie terminée ! Score : " + score;

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("bestScore", bestScore);
        bestText.textContent = bestScore;
        message.textContent += " 🥇 Nouveau record !";
      }
    }

    function restartGame() {
      clearInterval(timer);

      score = 0;
      time = 30;
      size = 65;
      gameStarted = false;

      scoreText.textContent = "0";
      timeText.textContent = "30";

      target.style.width = "65px";
      target.style.height = "65px";
      target.style.display = "block";

      message.textContent = "Clique sur le cercle rouge !";

      moveTarget();
    }

    restartGame();
  </script>

</body>
</html>
