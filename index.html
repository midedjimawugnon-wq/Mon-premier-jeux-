
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attrape le cercle</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(145deg, #10152f, #251052, #10152f);
  padding: 20px 14px;
}

h1 { margin: 12px 0 8px; font-size: 30px; }
.subtitle { color: #d2ccf5; margin-bottom: 22px; }

.stats {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 18px auto;
  max-width: 420px;
}

.stat {
  background: #ffffff16;
  border: 1px solid #ffffff25;
  border-radius: 14px;
  padding: 12px 8px;
  flex: 1;
}

.stat span { display: block; color: #c9bfff; font-size: 13px; }
.stat strong { display: block; font-size: 25px; margin-top: 5px; }

#arena {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 340px;
  margin: 18px auto;
  overflow: hidden;
  border: 2px solid #8d6aff;
  border-radius: 20px;
  background: #080b20;
  box-shadow: 0 0 25px #7652ff35;
}

#target {
  position: absolute;
  width: 54px;
  height: 54px;
  border: 4px solid white;
  border-radius: 50%;
  background: #ff4f9a;
  box-shadow: 0 0 20px #ff4f9a;
  display: none;
  touch-action: manipulation;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 14px 22px;
  margin: 5px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  background: #7954ff;
  cursor: pointer;
}

button:active { transform: scale(.96); }
#message { min-height: 28px; color: #ffe38b; }
footer { color: #aaa3cc; font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>

<h1>🎯 Attrape le cercle</h1>
<p class="subtitle">Teste tes réflexes et bats ton record !</p>

<div class="stats">
  <div class="stat">
    <span>SCORE</span>
    <strong id="score">0</strong>
  </div>
  <div class="stat">
    <span>TEMPS</span>
    <strong id="time">30</strong>
  </div>
  <div class="stat">
    <span>RECORD</span>
    <strong id="best">0</strong>
  </div>
</div>

<div id="arena">
  <button id="target" aria-label="Attraper le cercle"></button>
</div>

<p id="message">Appuie sur « Commencer » pour jouer !</p>
<button id="start">▶ Commencer</button>
<button id="restart">↻ Rejouer</button>

<footer>Un jeu de réflexes • Amuse-toi bien !</footer>

<script>
const arena = document.getElementById("arena");
const target = document.getElementById("target");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const bestText = document.getElementById("best");
const message = document.getElementById("message");
const startButton = document.getElementById("start");
const restartButton = document.getElementById("restart");

let score = 0;
let timeLeft = 30;
let playing = false;
let timer = null;
let best = 0;

try {
  best = Number(localStorage.getItem("cercleRecord")) || 0;
} catch (e) {}
bestText.textContent = best;

function moveTarget() {
  const maxX = arena.clientWidth - target.offsetWidth;
  const maxY = arena.clientHeight - target.offsetHeight;
  target.style.left = Math.random() * Math.max(0, maxX) + "px";
  target.style.top = Math.random() * Math.max(0, maxY) + "px";
}

function endGame() {
  playing = false;
  clearInterval(timer);
  target.style.display = "none";
  startButton.disabled = false;
  startButton.textContent = "▶ Recommencer";
  message.textContent = "⏰ Terminé ! Ton score : " + score;

  if (score > best) {
    best = score;
    bestText.textContent = best;
    try {
      localStorage.setItem("cercleRecord", String(best));
    } catch (e) {}
    message.textContent += " 🏆 Nouveau record !";
  }
}

function startGame() {
  clearInterval(timer);
  score = 0;
  timeLeft = 30;
  playing = true;
  scoreText.textContent = score;
  timeText.textContent = timeLeft;
  message.textContent = "Vite ! Attrape le cercle rose !";
  startButton.disabled = true;
  target.style.display = "block";
  moveTarget();

  timer = setInterval(() => {
    timeLeft--;
    timeText.textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
}

target.addEventListener("click", () => {
  if (!playing) return;
  score++;
  scoreText.textContent = score;
  moveTarget();
});

startButton.addEventListener("click", startGame);
restartButton.addEventListener("click", startGame);
</script>

</body>
</html>
